<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Impara Creative Labs | Learn. Create. Build. Beyond. Powered by TechKnots</title>
    <meta name="description" content="Impara Creative Labs offers 3-month industry-supported technology programmes in IoT & Embedded Systems, Full Stack Development with AI, and Mastering Generative AI. Powered by TechKnots." />
    <meta name="keywords" content="IoT and Embedded Systems course, Full Stack Development with AI, Generative AI training, Hands-on technology learning, Project-based learning, Capstone project training, TechKnots, Nixon E, Chennai engineering training" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://www.imparacreativelabs.com" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.imparacreativelabs.com/" />
    <meta property="og:title" content="Impara Creative Labs | Learn. Create. Build. Beyond." />
    <meta property="og:description" content="Turn curiosity into real-world skills through industry-supported technology programmes, hands-on projects, and guided capstone experiences. Powered by TechKnots." />
    <meta property="og:image" content="https://www.imparacreativelabs.com/assets/program-poster.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://www.imparacreativelabs.com/" />
    <meta property="twitter:title" content="Impara Creative Labs | Powered by TechKnots" />
    <meta property="twitter:description" content="3-month industry-supported technology career programmes with real capstone projects and mentor guidance." />
    <meta property="twitter:image" content="https://www.imparacreativelabs.com/assets/program-poster.jpg" />

    <!-- Preconnect to Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "Impara Creative Labs",
      "alternateName": "Impara",
      "slogan": "Learn. Create. Build. Beyond.",
      "url": "https://www.imparacreativelabs.com",
      "logo": "https://www.imparacreativelabs.com/assets/impara-logo.jpg",
      "telephone": "+91-9176747268",
      "email": "imparacreativelabs@gmail.com",
      "founder": {
        "@type": "Person",
        "name": "Nixon E",
        "jobTitle": "Founder & CEO",
        "description": "Technology researcher and innovator with 7+ years of experience across AI, IoT, embedded systems, robotics and automation. Founder of TechKnots and Impara Creative Labs."
      },
      "parentOrganization": {
        "@type": "Organization",
        "name": "TechKnots",
        "slogan": "One knot at a time"
      },
      "offers": [
        {
          "@type": "Course",
          "name": "IoT & Embedded Systems",
          "description": "3-month career programme covering microcontrollers, sensors, communication protocols, cloud dashboards and capstone project.",
          "timeRequired": "P3M"
        },
        {
          "@type": "Course",
          "name": "Full Stack Development with AI",
          "description": "3-month programme covering frontend, backend, databases, REST APIs, and modern AI API integration.",
          "timeRequired": "P3M"
        },
        {
          "@type": "Course",
          "name": "Mastering Generative AI",
          "description": "3-month programme covering LLM fundamentals, prompt engineering, RAG concepts, API integration, and generative AI capstone.",
          "timeRequired": "P3M"
        }
      ]
    }
    </script>
  </head>
  <body>
    <!-- Hidden form for Netlify build-time form detection -->
    <form name="enrolment-enquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="enrolment-enquiry" />
      <input type="text" name="bot-field" />
      <input type="text" name="fullName" />
      <input type="tel" name="mobileNumber" />
      <input type="email" name="email" />
      <input type="text" name="preferredCourse" />
      <input type="text" name="preferredSchedule" />
      <input type="text" name="learningMode" />
      <input type="text" name="currentStatus" />
      <input type="text" name="collegeOrOrganization" />
      <input type="text" name="degree" />
      <input type="text" name="graduationYear" />
      <textarea name="learningGoals"></textarea>
      <input type="checkbox" name="contactConsent" />
      <input type="checkbox" name="privacyConsent" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
